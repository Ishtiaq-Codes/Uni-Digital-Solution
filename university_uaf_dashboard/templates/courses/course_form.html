{% extends 'base.html' %}
{% block title %}{{ action }} Course - UAF{% endblock %}
{% block content %}
<div class="mb-6"><h1 class="page-title">{{ action }} Course</h1></div>
<div class="card max-w-2xl">
    <form method="post" class="space-y-4">{% csrf_token %}
        {% for field in form %}
        <div class="form-group"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<p class="form-error">{{ field.errors.0 }}</p>{% endif %}</div>
        {% endfor %}
        <div class="flex gap-3 pt-2"><button type="submit" class="btn-primary">{{ action }} Course</button><a href="{% url 'courses:list' %}" class="btn-secondary">Cancel</a></div>
    </form>
</div>
{% endblock %}
