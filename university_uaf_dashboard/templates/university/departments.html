{% extends 'base.html' %}
{% block title %}Departments - UAF{% endblock %}
{% block content %}
<div class="mb-6"><h1 class="page-title">Departments</h1></div>
<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for d in departments %}
    <a href="{% url 'university:department_detail' pk=d.pk %}" class="card hover:border-indigo-200 hover:-translate-y-0.5 transition-all duration-200 block">
        <div class="w-10 h-10 bg-indigo-100 rounded-xl flex items-center justify-center mb-3"><svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5"/></svg></div>
        <h3 class="font-bold text-slate-900">{{ d.name }}</h3><p class="text-xs text-indigo-600 font-medium">{{ d.code }}</p>
        <p class="text-sm text-slate-500 mt-2 line-clamp-2">{{ d.description|default:"Department of the university." }}</p>
    </a>
    {% empty %}<div class="col-span-3 text-center py-12 text-slate-400">No departments added yet.</div>{% endfor %}
</div>
{% endblock %}
