{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="csrf-token" content="{{ csrf_token }}"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><title>Reset Password - UAF</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'css/output.css' %}"></head>
<body class="font-sans bg-slate-50 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">
    <div class="text-center mb-8"><h2 class="text-2xl font-bold text-slate-900 mb-2">Reset Password</h2><p class="text-sm text-slate-500">Enter your new password</p></div>
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <form method="post" class="space-y-4">{% csrf_token %}
            {% for field in form %}<div class="form-group"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<p class="form-error">{{ field.errors.0 }}</p>{% endif %}</div>{% endfor %}
            <button type="submit" class="btn-primary w-full py-3">Reset Password</button>
        </form>
    </div>
</div>
</body></html>
