{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="csrf-token" content="{{ csrf_token }}"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><title>Forgot Password - UAF</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'css/output.css' %}"></head>
<body class="font-sans bg-slate-50 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">
    <div class="text-center mb-8"><h2 class="text-2xl font-bold text-slate-900 mb-2">Forgot Password</h2><p class="text-sm text-slate-500">Enter your email to receive a reset link</p></div>
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        {% if messages %}{% for message in messages %}<div class="mb-4 px-4 py-3 rounded-lg text-sm bg-emerald-50 text-emerald-700 border border-emerald-200">{{ message }}</div>{% endfor %}{% endif %}
        <form method="post" class="space-y-4">{% csrf_token %}
            <div class="form-group"><label class="form-label">Email Address</label>{{ form.email }}</div>
            <button type="submit" class="btn-primary w-full py-3">Send Reset Link</button>
        </form>
    </div>
    <p class="text-center text-sm text-slate-500 mt-6"><a href="{% url 'accounts:login' %}" class="text-indigo-600 font-semibold">&larr; Back to login</a></p>
</div>
</body></html>
