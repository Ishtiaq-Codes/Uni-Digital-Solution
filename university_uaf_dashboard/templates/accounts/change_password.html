{% extends 'base.html' %}
{% block title %}Change Password - UAF{% endblock %}
{% block content %}
<div class="mb-6"><h1 class="page-title">Change Password</h1></div>
<div class="card max-w-md">
    <form method="post" class="space-y-4">{% csrf_token %}
        {% for field in form %}<div class="form-group"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<p class="form-error">{{ field.errors.0 }}</p>{% endif %}</div>{% endfor %}
        <button type="submit" class="btn-primary w-full">Update Password</button>
    </form>
</div>
{% endblock %}
