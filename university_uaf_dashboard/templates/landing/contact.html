{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact - UAF</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'css/output.css' %}"></head>
<body class="font-sans bg-white text-slate-700 antialiased">
<nav class="bg-white border-b border-slate-100 sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16"><a href="{% url 'dashboard:landing' %}" class="flex items-center gap-3"><div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13"/></svg></div><span class="font-bold text-lg text-slate-900">UAF Dashboard</span></a><a href="{% url 'accounts:login' %}" class="btn-primary btn-sm">Sign In</a></div></nav>
<div class="max-w-4xl mx-auto px-4 py-16">
    <h1 class="text-4xl font-extrabold text-slate-900 mb-6 text-center">Contact Us</h1>
    <div class="grid md:grid-cols-2 gap-8">
        <div><h3 class="font-bold text-slate-900 mb-4">University of Agriculture Faisalabad</h3><div class="space-y-3 text-sm text-slate-600"><p>📍 University Road, Faisalabad, Punjab, Pakistan 38000</p><p>📧 info@uaf.edu.pk</p><p>📞 +92 41 9200161-70</p><p>🌐 www.uaf.edu.pk</p></div></div>
        <div class="bg-slate-50 rounded-xl p-6"><h3 class="font-bold text-slate-900 mb-4">Send a Message</h3><form class="space-y-3"><input type="text" placeholder="Your Name" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"><input type="email" placeholder="Your Email" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"><textarea rows="4" placeholder="Your Message" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 resize-none"></textarea><button type="button" class="btn-primary w-full" onclick="alert('Thank you! Your message has been received.')">Send Message</button></form></div>
    </div>
</div>
</body></html>
